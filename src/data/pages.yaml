home:
  title: "SuperCritical Materials"
  heroLines:
    - "BUILDING A NEW CATEGORY OF"
    - "NUCLEAR FUEL INFRASTRUCTURE"
  paragraphs:
    - "SuperCritical Materials is developing a new source of uranium for the next nuclear age. The world’s oceans contain an estimated 4.5 billion metric tons of dissolved uranium—an enormous, globally distributed resource. SuperCritical is working to transform that resource into a scalable source of nuclear fuel by commercializing uranium-from-seawater technology developed through decades of U.S. government research."
    - "SuperCritical holds an exclusive commercial license to DOE/PNNL-developed uranium adsorbent technology and is advancing the engineering required to deploy, recover and reuse uranium-selective adsorbents in marine environments. The process captures dissolved uranium as seawater passes across the adsorbent; the material is then retrieved, the uranium recovered, and the adsorbent prepared for repeated deployment cycles. The company’s current challenge is demonstrating repeatable, cost-competitive performance on an industrial scale."
    - "Working with leading engineering and research partners, SuperCritical is progressing from laboratory science to offshore systems, pilot deployment, economic validation and ultimately commercial production. Its collaboration with the University of Michigan is developing and testing the mechanical systems needed to deploy and retrieve adsorbent under realistic marine conditions, helping bridge the gap between materials science and industrial-scale offshore operations."
    - "As nuclear energy expands to meet rising demand from AI, data centers, electrification and energy security, SuperCritical is working to expand future uranium availability and strengthen the domestic nuclear fuel supply chain."
    - "For 80 years, the nuclear age has depended on uranium we could find beneath our feet. The next nuclear age may be fueled by what has been around us all along."
  actions:
    - label: "News"
      href: "/news/"
    - label: "Contact Us"
      href: "/contact-us/"
technology:
  title: "Technology"
  sections:
    - heading: "FROM SEAWATER TO NUCLEAR FUEL"
      subheading: "Transforming decades of U.S. government research into a new source of uranium"
      paragraphs:
        - "The world’s oceans contain an estimated 4.5 billion metric tons of dissolved uranium. SuperCritical Materials is developing the technology and infrastructure to recover this globally distributed resource and expand future nuclear fuel supply."
        - "SuperCritical holds an exclusive commercial license to DOE/PNNL-developed uranium adsorbent technology. Science has demonstrated that uranium can be captured from seawater and recovered from the adsorbent. SuperCritical is demonstrating a repeatable, cost-competitive system on an industrial scale."
      steps: []
    - heading: "HOW IT WORKS"
      subheading: ""
      paragraphs:
        - "**01 — DEPLOY**"
        - "Uranium-selective adsorbent is deployed in seawater."
        - "**02 — ADSORB**"
        - "Dissolved uranium and other metals bind to the adsorbent."
        - "**03 — RECOVER**"
        - "The material is retrieved and processed to recover the captured uranium."
        - "**04 — REUSE**"
        - "The adsorbent is prepared for another deployment cycle."
        - "SuperCritical is engineering this deploy–adsorb–recover–reuse process for repeated operation at progressively larger scale."
      steps: []
    - heading: "FROM MATERIALS SCIENCE TO OFFSHORE SYSTEMS"
      subheading: ""
      paragraphs:
        - "Commercialization requires systems capable of deploying and retrieving large quantities of adsorbent efficiently in marine environments."
        - "Working with the University of Michigan, SuperCritical is testing adsorbent performance, packing configurations, deployment and retrieval equipment, and hydrodynamics. This work is informing future offshore pilot systems."
      steps: []
    - heading: "A DIFFERENT APPROACH TO URANIUM SUPPLY"
      subheading: ""
      paragraphs:
        - "Unlike conventional uranium production, seawater recovery does not depend on locating and developing an ore body. Uranium is continuously present throughout the world’s oceans at a low, relatively consistent concentration."
        - "SuperCritical is developing a reusable recovery system with the potential for a fundamentally different resource footprint. Environmental performance, permitting and economics remain subject to testing and validation."
      steps: []
    - heading: "PROVING SCALE AND ECONOMICS"
      subheading: ""
      paragraphs:
        - "The question is no longer simply whether uranium can be recovered from seawater, but whether it can be recovered repeatedly, reliably and economically at industrial scale."
        - "Testing and future offshore pilots will inform economic modeling, feasibility engineering and demonstration-scale system design."
      steps: []
    - heading: "BUILDING THE FUEL LAYER FOR THE NEXT NUCLEAR AGE"
      subheading: ""
      paragraphs:
        - "SuperCritical is moving uranium-from-seawater technology from government-developed science toward industrial infrastructure—with the potential to expand uranium supply and strengthen U.S. energy security. Uranium exists. Our job is to engineer a system that can recover it at scale."
      steps: []
