technology:
  title: "Technology | SuperCritical Materials"
  heading: "Technology"
  subheading: "FROM SEAWATER TO NUCLEAR FUEL"
  tagline: "Transforming decades of U.S. government research into a new source of uranium"
  intro:
    - "The world’s oceans contain an estimated 4.5 billion metric tons of dissolved uranium. SuperCritical Materials is developing the technology and infrastructure to recover this globally distributed resource and expand future nuclear fuel supply."
    - "SuperCritical holds an exclusive U.S. commercial license to DOE/PNNL-developed uranium adsorbent technology. Science has demonstrated that uranium can be captured from seawater and recovered from the adsorbent. SuperCritical is demonstrating a repeatable, cost-competitive system on an industrial scale."
  howItWorks:
    heading: "HOW IT WORKS"
    steps:
      - { label: "01 — DEPLOY", text: "Uranium-selective adsorbent is deployed in seawater." }
      - { label: "02 — ADSORB", text: "Dissolved uranium and other metals bind to the adsorbent." }
      - { label: "03 — RECOVER", text: "The material is retrieved and processed to recover the captured uranium." }
      - { label: "04 — REUSE", text: "The adsorbent is prepared for another deployment cycle." }
    outro: "SuperCritical is engineering this deploy–adsorb–recover–reuse process for repeated operation at progressively larger scale."
  sections:
    - heading: "FROM MATERIALS SCIENCE TO OFFSHORE SYSTEMS"
      body:
        - "Commercialization requires systems capable of deploying and retrieving large quantities of adsorbent efficiently in marine environments."
        - "Working with the University of Michigan, SuperCritical is testing adsorbent performance, packing configurations, deployment and retrieval equipment, and hydrodynamics. This work is informing future offshore pilot systems."
    - heading: "A DIFFERENT APPROACH TO URANIUM SUPPLY"
      body:
        - "Unlike conventional uranium production, seawater recovery does not depend on locating and developing an ore body. Uranium is continuously present throughout the world’s oceans at a low, relatively consistent concentration."
        - "SuperCritical is developing a reusable recovery system with the potential for a fundamentally different resource footprint. Environmental performance, permitting and economics remain subject to testing and validation."
    - heading: "PROVING SCALE AND ECONOMICS"
      body:
        - "The question is no longer simply whether uranium can be recovered from seawater, but whether it can be recovered repeatedly, reliably and economically at industrial scale."
        - "Testing and future offshore pilots will inform economic modeling, feasibility engineering and demonstration-scale system design."
    - heading: "BUILDING THE FUEL LAYER FOR THE NEXT NUCLEAR AGE"
      body:
        - "SuperCritical is moving uranium-from-seawater technology from government-developed science toward industrial infrastructure—with the potential to expand uranium supply and strengthen U.S. energy security. Uranium exists. Our job is to engineer a system that can recover it at scale."
  license:
    heading: "Patented Technology and Exclusive Licensing Rights"
    body:
      - "SuperCritical Materials holds an exclusive U.S. commercial license from Battelle Memorial Institute (BMI), operator of the U.S. Department of Energy's Pacific Northwest National Laboratory (PNNL), for patented technology that converts acrylic fibers into amidoxime-carboxylate adsorbents capable of capturing uranium and other elements from water."
      - "The underlying patent (U.S. Patent No. 10,570,027) was filed on June 10, 2016, and granted on February 25, 2020. SuperCritical initially secured a non-exclusive license on February 11, 2025, followed by an exclusive U.S. commercial license on August 25, 2025, covering the extraction of uranium and uranium compounds from water."
      - "The Company publicly announced the licensing agreement on July 24, 2026, marking an important milestone in its strategy to commercialize uranium-from-seawater technology and develop a new source of nuclear fuel."
      - "The agreement provides a foundation for advancing the technology from laboratory research toward pilot-scale testing, engineering validation and eventual commercial production. SuperCritical's development program is focused on demonstrating that uranium-selective adsorbents can be manufactured, deployed, retrieved, regenerated and reused at the scale and cost required for economically competitive uranium production."

